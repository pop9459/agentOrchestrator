[project]
name = "ao"
version = "0.1.0"
description = "agentOrchestrator: a small, token-efficient company of hireable agents"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "python-dotenv>=1",
    "typer>=0.12",
]

[project.scripts]
ao = "ao.cli:app"

[project.optional-dependencies]
keyring = [
    "keyring>=25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ao"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
